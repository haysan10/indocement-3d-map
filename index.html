<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indocement Citeureup — 3D Interactive Map</title>
  <style>
    :root {
      --bg-panel: rgba(12, 18, 28, 0.84);
      --bg-hover: rgba(30, 45, 68, 0.92);
      --border: rgba(148, 163, 184, 0.22);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --amber: #f59e0b;
      --emerald: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0b111c; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-wrap { position: fixed; inset: 0; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }

    /* Top Header Bar */
    .topbar {
      position: fixed; top: 14px; left: 14px; right: 14px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; pointer-events: none; z-index: 20;
    }
    .card {
      pointer-events: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 14px;
    }
    .brand-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 10px var(--accent);
      flex-shrink: 0;
    }
    .brand h1 { font-size: 14px; font-weight: 650; letter-spacing: 0.01em; line-height: 1.2; }
    .brand p { font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

    .actions {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px;
    }
    .btn {
      appearance: none; border: 1px solid transparent;
      background: transparent; color: var(--text);
      padding: 7px 11px; border-radius: 7px; font-size: 12px; font-weight: 550;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      text-decoration: none; white-space: nowrap;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border); }
    .btn.active { background: rgba(56, 189, 248, 0.18); border-color: rgba(56, 189, 248, 0.55); color: #bae6fd; }
    .btn.primary {
      background: #0284c7; border-color: #38bdf8; color: #ffffff;
    }
    .btn.primary:hover { background: #0369a1; }

    /* Left Collapsible Landmark Drawer */
    .sidebar {
      position: fixed; top: 76px; left: 14px; width: 252px; max-height: calc(100vh - 156px);
      display: flex; flex-direction: column; z-index: 20; transition: transform 0.22s ease, opacity 0.22s ease;
    }
    .sidebar.collapsed { transform: translateX(-272px); opacity: 0; pointer-events: none; }
    .sidebar-head {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .sidebar-head span { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .search-box {
      padding: 8px 10px; border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 6px 9px; font-size: 12px; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .landmark-list {
      overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 3px;
    }
    .landmark-item {
      text-align: left; width: 100%; background: transparent; border: 1px solid transparent;
      color: var(--text); padding: 7px 9px; border-radius: 7px; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .landmark-item:hover { background: var(--bg-hover); border-color: var(--border); }
    .landmark-item.selected { background: rgba(56, 189, 248, 0.16); border-color: rgba(56, 189, 248, 0.5); }
    .lm-name { font-size: 12px; font-weight: 550; }
    .lm-cat { font-size: 10px; padding: 2px 6px; border-radius: 999px; background: rgba(148,163,184,0.16); color: var(--muted); flex-shrink: 0; }
    .lm-cat.plant { background: rgba(56,189,248,0.16); color: #7dd3fc; }
    .lm-cat.log { background: rgba(245,158,11,0.16); color: #fcd34d; }
    .lm-cat.env { background: rgba(16,185,129,0.16); color: #6ee7b7; }

    /* Right Telemetry Info Box (appears when landmark selected) */
    .info-box {
      position: fixed; top: 76px; right: 14px; width: 260px; padding: 12px 14px;
      z-index: 20; display: none;
    }
    .info-box.visible { display: block; }
    .info-box h2 { font-size: 13px; font-weight: 650; margin-bottom: 4px; }
    .info-box p { font-size: 12px; color: #cbd5e1; line-height: 1.45; }
    .info-meta { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }

    /* Bottom Camera Dock */
    .bottom-dock {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 4px; padding: 6px;
      z-index: 20; max-width: calc(100vw - 28px); overflow-x: auto;
    }
    .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex-shrink: 0; }

    /* 3D Projected Landmark Pins */
    #pins-layer { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
    .pin {
      position: absolute; transform: translate(-50%, -100%);
      pointer-events: auto; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      transition: opacity 0.15s ease;
    }
    .pin-label {
      background: rgba(11, 17, 28, 0.86); color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 3px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 600;
      white-space: nowrap; box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    }
    .pin.active .pin-label { border-color: var(--accent); background: #0c4a6e; color: #e0f2fe; }
    .pin-stem { width: 1.5px; height: 10px; background: rgba(248, 250, 252, 0.7); }
    .pin-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); border: 1px solid #fff; }

    /* Loading Screen */
    #loader {
      position: fixed; inset: 0; background: #0b111c; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      transition: opacity 0.35s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .loader-title { font-size: 16px; font-weight: 650; letter-spacing: 0.02em; }
    .loader-sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .bar-wrap { width: 280px; height: 6px; background: rgba(148, 163, 184, 0.16); border-radius: 99px; overflow: hidden; }
    .bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); transition: width 0.15s ease; }

    @media (max-width: 720px) {
      .sidebar { width: 215px; top: 68px; }
      .brand p { display: none; }
      .info-box { display: none !important; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loader">
    <div class="loader-title">PT Indocement Citeureup — 3D Map</div>
    <div class="bar-wrap"><div id="bar-fill" class="bar-fill"></div></div>
    <div id="loader-sub" class="loader-sub">Memuat model GLB (12 MB)...</div>
  </div>

  <div id="canvas-wrap"></div>
  <div id="pins-layer"></div>

  <header class="topbar">
    <div class="card brand">
      <div class="brand-dot" id="status-dot"></div>
      <div>
        <h1>Peta 3D Kawasan PT Indocement Citeureup</h1>
        <p id="stats-line">Blender 5.3 GLB · 229,982 tris · 43 WebP PBR textures</p>
      </div>
    </div>
    <div class="card actions">
      <button class="btn active" id="btn-sidebar" title="Daftar Lokasi">Lokasi</button>
      <button class="btn active" id="btn-pins" title="Tampilkan/Sembunyikan Pin">Pin Map</button>
      <button class="btn" id="btn-wireframe" title="Mode Wireframe">Wireframe</button>
      <button class="btn" id="btn-rotate" title="Putar Otomatis">Auto-Orbit</button>
      <div class="divider"></div>
      <button class="btn active" data-mood="day">Siang</button>
      <button class="btn" data-mood="golden">Sore</button>
      <button class="btn" data-mood="night">Malam</button>
      <div class="divider"></div>
      <a class="btn primary" href="./indocement_3d_map_full.glb" download="indocement_3d_map_full.glb">Download GLB</a>
    </div>
  </header>

  <aside class="card sidebar" id="sidebar">
    <div class="sidebar-head">
      <span>Titik Lokasi Peta</span>
      <span id="lm-count">15</span>
    </div>
    <div class="search-box">
      <input type="text" id="lm-search" placeholder="Cari pabrik, kantor, sungai..." />
    </div>
    <div class="landmark-list" id="lm-list"></div>
  </aside>

  <section class="card info-box" id="info-box">
    <h2 id="info-title">Lokasi</h2>
    <p id="info-desc"></p>
    <div class="info-meta">
      <span id="info-zone">-</span>
      <span id="info-coord">0, 0</span>
    </div>
  </section>

  <nav class="card bottom-dock">
    <button class="btn active" data-cam="overview">Overview</button>
    <button class="btn" data-cam="preheater">Plant 14 &amp; Kiln</button>
    <button class="btn" data-cam="domes">Kubah &amp; Konveyor</button>
    <button class="btn" data-cam="gate">Gerbang Utama</button>
    <button class="btn" data-cam="river">Sungai &amp; Masjid</button>
    <button class="btn" data-cam="top">Top-Down GIS</button>
  </nav>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // Exact Y-up coordinates mapped from Blender (X, Y, Z) -> (X, Z, -Y)
    const CAM_PRESETS = {
      overview:  { pos: [0, 128, 162],     target: [0, 0, 2] },
      preheater: { pos: [46, 20, 34],      target: [80, 6.2, -1] },
      domes:     { pos: [-46, 38, 78],     target: [-14, 4, 6] },
      gate:      { pos: [-68, 12, -20],    target: [-46, 3.2, -42] },
      river:     { pos: [34, 28, 88],      target: [14, 1.5, 38] },
      top:       { pos: [0, 215, 0.5],     target: [0, 0, 0] },
    };

    const LANDMARKS = [
      { id: 'plant14_kiln', name: 'Plant 14 Preheater & Kilns', cat: 'plant', label: 'Pabrik',
        pos: [80, 14, -1], view: [48, 22, 32],
        desc: 'Menara preheater rangka baja terbuka 5–6 lantai dengan unit siklon internal, 2 rotary kiln miring 4°, cerobong uap, dan 5 silo semen.' },
      { id: 'domes', name: 'Kompleks 5 Storage Domes', cat: 'plant', label: 'Kubah',
        pos: [-24, 10, -8], view: [-48, 34, 52],
        desc: 'Kubah penyimpanan material baku & clinker dome berstruktur rusuk baja meridional, pilar buttress bertingkat, dan portal konveyor.' },
      { id: 'main_gate', name: 'Gerbang Utama Jl. Indocement', cat: 'log', label: 'Gerbang',
        pos: [-54.8, 5.5, -43], view: [-68, 12, -20],
        desc: 'Akses masuk utama kawasan pabrik dengan kanopi portal, pos satpam berkaca, boom gate, zebra cross, dan truk molen.' },
      { id: 'gmo_office', name: 'GMO & Plant 14 Office', cat: 'plant', label: 'Kantor',
        pos: [24, 7, -6], view: [8, 20, 22],
        desc: 'Kompleks gedung administrasi & kontrol operasi PT Indocement Plant 14 lengkap dengan area parkir dan jalur pedestrian.' },
      { id: 'rail_silo', name: 'Jalur Rel & Cement Silos', cat: 'log', label: 'Logistik',
        pos: [88, 6, 4], view: [66, 16, 28],
        desc: 'Jalur rel internal berbantalan beton di sisi utara sungai dengan 3 gerbong tangki curah dan jalur muat bawah silo.' },
      { id: 'tank_sub', name: 'Tank Farm & Substation', cat: 'plant', label: 'Utilitas',
        pos: [58, 6, -28], view: [38, 18, -8],
        desc: 'Tangki bahan bakar/air dalam tanggul beton, 2 tangki LPG horizontal, gardu induk listrik, dan jembatan pipe rack.' },
      { id: 'clinker_pile', name: 'Open Clinker Stockpile', cat: 'plant', label: 'Klinker',
        pos: [-2, 4, 26], view: [-16, 16, 48],
        desc: 'Bunker penyimpanan terbuka klinker berdinding beton dengan konveyor pengumpan dan unit excavator berat.' },
      { id: 'mining_dp2', name: 'Mining DP 02 & Mechanical DP 2', cat: 'plant', label: 'Tambang',
        pos: [-90, 5, -14], view: [-65, 24, 14],
        desc: 'Deretan bengkel pemeliharaan mekanikal DP 2 dan gudang operasional Mining DP 02 di teras barat.' },
      { id: 'paper_bag', name: 'Paper Bag Division', cat: 'log', label: 'Produksi',
        pos: [-54, 5, 14], view: [-32, 22, 34],
        desc: 'Aula industri produksi kemasan kantong semen beratap metal bergelombang dan dermaga bongkar muat.' },
      { id: 'logistic_div', name: 'Indocement Logistic Div', cat: 'log', label: 'Logistik',
        pos: [50, 6, -54], view: [30, 18, -32],
        desc: 'Pelataran kontainer ekspor/distribusi dan gudang logistik dengan forklift serta truk trailer.' },
      { id: 'inti_abadi', name: 'PT Inti Abadi Kemasindo', cat: 'log', label: 'Industri',
        pos: [-36, 5, -38], view: [-18, 20, -14],
        desc: 'Fasilitas gudang pengemasan di koridor Jl. Indocement sisi utara.' },
      { id: 'indofood_coats', name: 'PT Indofood & PT Coats Rejo', cat: 'log', label: 'Kawasan',
        pos: [100, 6, -42], view: [68, 24, -14],
        desc: 'Kawasan pergudangan timur, Gudang Cimory Baru, serta area parkir bertanda khusus PT Coats Rejo Indonesia.' },
      { id: 'masjid', name: 'Masjid Jami Miftahussaadah', cat: 'env', label: 'Ibadah',
        pos: [22, 7, 63], view: [12, 18, 92],
        desc: 'Masjid di sisi selatan Sungai Cileungsi dengan serambi terbuka 12 tiang, kubah emas metalik, dan menara azan.' },
      { id: 'pemancingan', name: 'Pemancingan Kampus & Sungai', cat: 'env', label: 'Lanskap',
        pos: [64, 3, 36], view: [42, 22, 66],
        desc: '3 kolam pemancingan berlekuk alami lengkap dengan saung kayu beratap genteng, dermaga jetty, dan rumpun bambu.' },
      { id: 'lemper_bengkel', name: 'GOR Lemper & Bengkel Peredam', cat: 'env', label: 'Warga',
        pos: [-94, 5, 48], view: [-72, 22, 78],
        desc: 'Fasilitas olahraga GOR Lemper Badminton di bukit barat daya serta Bengkel Peredam di tepi Jl. KH Natsir.' },
    ];

    const wrap = document.getElementById('canvas-wrap');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.AgXToneMapping ?? THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = envTex;
    scene.environmentIntensity = 0.55;

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 1200);
    camera.position.set(...CAM_PRESETS.overview.pos);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.485;
    controls.minDistance = 8;
    controls.maxDistance = 360;
    controls.target.set(...CAM_PRESETS.overview.target);
    controls.addEventListener('start', () => { flyState = null; });

    // Lighting Rig
    const hemi = new THREE.HemisphereLight(0xdbeafe, 0x3f4a3c, 0.85);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1dc, 2.7);
    sun.position.set(-90, 140, 110);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 20;
    sun.shadow.camera.far = 420;
    sun.shadow.camera.left = -140;
    sun.shadow.camera.right = 140;
    sun.shadow.camera.top = 120;
    sun.shadow.camera.bottom = -120;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.04;
    scene.add(sun);

    const nightLights = new THREE.Group();
    const nPoints = [
      [-54, 6, -42, 0xffc87a, 50],
      [78, 12, -1, 0xffb86c, 90],
      [24, 9, -6, 0xdbeafe, 65],
      [-24, 10, 6, 0xffd28a, 75],
      [96, 10, 4, 0xdbeafe, 70],
      [22, 8, 63, 0xffd166, 55],
    ];
    for (const [px, py, pz, col, dist] of nPoints) {
      const pl = new THREE.PointLight(col, 3.8, dist, 1.4);
      pl.position.set(px, py, pz);
      nightLights.add(pl);
    }
    nightLights.visible = false;
    scene.add(nightLights);

    const MOODS = {
      day: {
        bg: 0xc2d0dc, fogCol: 0xc2d0dc, fogDens: 0.0009,
        sunCol: 0xfff2dd, sunInt: 2.75, sunPos: [-90, 140, 110],
        hemiSky: 0xdbeafe, hemiGnd: 0x3b4838, hemiInt: 0.85,
        envInt: 0.55, exposure: 1.05, night: false,
      },
      golden: {
        bg: 0xd9b38c, fogCol: 0xd8b28d, fogDens: 0.0014,
        sunCol: 0xff9e4a, sunInt: 3.2, sunPos: [-150, 46, 90],
        hemiSky: 0xfed7aa, hemiGnd: 0x3c2e28, hemiInt: 0.72,
        envInt: 0.48, exposure: 1.0, night: false,
      },
      night: {
        bg: 0x0a101d, fogCol: 0x0f172a, fogDens: 0.0028,
        sunCol: 0x93c5fd, sunInt: 0.42, sunPos: [80, 110, -80],
        hemiSky: 0x1e293b, hemiGnd: 0x0f172a, hemiInt: 0.45,
        envInt: 0.14, exposure: 1.12, night: true,
      },
    };

    let loadedRoot = null;
    const emissiveMats = [];

    function applyMood(key) {
      const m = MOODS[key];
      scene.background = new THREE.Color(m.bg);
      scene.fog = new THREE.FogExp2(m.fogCol, m.fogDens);
      sun.color.setHex(m.sunCol);
      sun.intensity = m.sunInt;
      sun.position.set(...m.sunPos);
      hemi.color.setHex(m.hemiSky);
      hemi.groundColor.setHex(m.hemiGnd);
      hemi.intensity = m.hemiInt;
      scene.environmentIntensity = m.envInt;
      renderer.toneMappingExposure = m.exposure;
      nightLights.visible = m.night;
      for (const mat of emissiveMats) {
        if (mat.name.includes('Glass') || mat.name.includes('Window')) {
          mat.emissive.setHex(m.night ? 0xffcf78 : 0x000000);
          mat.emissiveIntensity = m.night ? 1.8 : 0.0;
        } else if (mat.name.includes('Lamp') || mat.name.includes('Headlight')) {
          mat.emissive.setHex(m.night ? 0xffdf94 : 0x222222);
          mat.emissiveIntensity = m.night ? 3.5 : 0.1;
        } else if (mat.name.startsWith('M_Sign_')) {
          mat.emissiveIntensity = m.night ? 1.2 : 0.08;
        }
      }
      document.querySelectorAll('[data-mood]').forEach(b => b.classList.toggle('active', b.dataset.mood === key));
    }
    applyMood('day');

    // Camera fly-to interpolation
    let flyState = null;
    function flyTo(pos, target) {
      flyState = {
        startPos: camera.position.clone(),
        startTarget: controls.target.clone(),
        endPos: new THREE.Vector3(...pos),
        endTarget: new THREE.Vector3(...target),
        t: 0,
      };
    }

    // Populate Landmarks Sidebar & 3D Pins
    const lmList = document.getElementById('lm-list');
    const pinsLayer = document.getElementById('pins-layer');
    const pinEls = new Map();
    const infoBox = document.getElementById('info-box');
    let selectedLm = null;

    function selectLandmark(lm) {
      selectedLm = lm;
      flyTo(lm.view, lm.pos);
      document.getElementById('info-title').textContent = lm.name;
      document.getElementById('info-desc').textContent = lm.desc;
      document.getElementById('info-zone').textContent = lm.label;
      document.getElementById('info-coord').textContent = `X:${lm.pos[0].toFixed(0)} Z:${lm.pos[2].toFixed(0)}`;
      infoBox.classList.add('visible');
      document.querySelectorAll('.landmark-item').forEach(el => el.classList.toggle('selected', el.dataset.id === lm.id));
      pinEls.forEach((el, id) => el.classList.toggle('active', id === lm.id));
    }

    function renderLandmarkList(filter = '') {
      lmList.innerHTML = '';
      const q = filter.trim().toLowerCase();
      const filtered = LANDMARKS.filter(l => l.name.toLowerCase().includes(q) || l.label.toLowerCase().includes(q));
      document.getElementById('lm-count').textContent = filtered.length;
      for (const lm of filtered) {
        const btn = document.createElement('button');
        btn.className = 'landmark-item' + (selectedLm?.id === lm.id ? ' selected' : '');
        btn.dataset.id = lm.id;
        btn.innerHTML = `<span class="lm-name">${lm.name}</span><span class="lm-cat ${lm.cat}">${lm.label}</span>`;
        btn.onclick = () => selectLandmark(lm);
        lmList.appendChild(btn);
      }
    }

    for (const lm of LANDMARKS) {
      const pin = document.createElement('div');
      pin.className = 'pin';
      pin.innerHTML = `<div class="pin-label">${lm.name}</div><div class="pin-stem"></div><div class="pin-dot"></div>`;
      pin.onclick = () => selectLandmark(lm);
      pinsLayer.appendChild(pin);
      pinEls.set(lm.id, pin);
    }
    renderLandmarkList();

    document.getElementById('lm-search').addEventListener('input', (e) => renderLandmarkList(e.target.value));

    // Load Full Upgraded GLB
    const loader = new GLTFLoader();
    const barFill = document.getElementById('bar-fill');
    const loaderSub = document.getElementById('loader-sub');
    loader.load(
      './indocement_3d_map_full.glb',
      (gltf) => {
        loadedRoot = gltf.scene;
        const matSet = new Set();
        let triCount = 0;
        loadedRoot.traverse((obj) => {
          if (obj.isMesh) {
            const name = obj.name || '';
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            const isPlume = name.includes('Plume') || mats.some(m => m?.name.includes('Plume'));
            const isGroundOrWater = name.includes('Terrain') || name.includes('River_Water') || name.includes('Plinth');
            obj.castShadow = !(isPlume || isGroundOrWater);
            obj.receiveShadow = !isPlume;
            if (obj.geometry) {
              triCount += obj.geometry.index
                ? obj.geometry.index.count / 3
                : obj.geometry.attributes.position.count / 3;
            }
            for (const mat of mats) {
              if (!mat || matSet.has(mat)) continue;
              matSet.add(mat);
              if (mat.name.includes('Leaf') || mat.name.includes('Grass')) {
                mat.transparent = false;
                mat.depthWrite = true;
                mat.alphaTest = 0.45;
                mat.side = THREE.DoubleSide;
              } else if (mat.name.includes('Plume')) {
                mat.transparent = true;
                mat.depthWrite = false;
              }
              if (mat.name.includes('Glass') || mat.name.includes('Window') || mat.name.includes('Lamp') ||
                  mat.name.includes('Headlight') || mat.name.startsWith('M_Sign_')) {
                emissiveMats.push(mat);
              }
            }
          }
        });
        scene.add(loadedRoot);
        applyMood('day');
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('stats-line').textContent =
          `Siap · ${matSet.size} PBR materials · ${Math.round(triCount).toLocaleString('en-US')} tris · WebGL2`;
      },
      (xhr) => {
        if (xhr.total > 0) {
          const pct = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100));
          barFill.style.width = `${pct}%`;
          loaderSub.textContent = `Memuat model GLB (${(xhr.loaded / 1048576).toFixed(1)} / ${(xhr.total / 1048576).toFixed(1)} MB) — ${pct}%`;
        } else {
          loaderSub.textContent = `Memuat model GLB (${(xhr.loaded / 1048576).toFixed(1)} MB)...`;
        }
      },
      (err) => {
        console.error('GLB load failed:', err);
        loaderSub.textContent = 'Gagal memuat indocement_3d_map_full.glb — cek console.';
        document.getElementById('status-dot').style.background = '#ef4444';
      }
    );

    // UI Controls
    document.getElementById('btn-sidebar').onclick = (e) => {
      document.getElementById('sidebar').classList.toggle('collapsed');
      e.currentTarget.classList.toggle('active');
    };
    let showPins = true;
    document.getElementById('btn-pins').onclick = (e) => {
      showPins = !showPins;
      pinsLayer.style.display = showPins ? 'block' : 'none';
      e.currentTarget.classList.toggle('active', showPins);
    };
    let wireMode = false;
    document.getElementById('btn-wireframe').onclick = (e) => {
      wireMode = !wireMode;
      e.currentTarget.classList.toggle('active', wireMode);
      if (loadedRoot) {
        loadedRoot.traverse((o) => {
          if (o.isMesh) {
            const ms = Array.isArray(o.material) ? o.material : [o.material];
            ms.forEach(m => { if (m) m.wireframe = wireMode; });
          }
        });
      }
    };
    document.getElementById('btn-rotate').onclick = (e) => {
      controls.autoRotate = !controls.autoRotate;
      controls.autoRotateSpeed = 0.65;
      e.currentTarget.classList.toggle('active', controls.autoRotate);
    };
    document.querySelectorAll('[data-mood]').forEach(btn => {
      btn.onclick = () => applyMood(btn.dataset.mood);
    });
    document.querySelectorAll('[data-cam]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('[data-cam]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const c = CAM_PRESETS[btn.dataset.cam];
        flyTo(c.pos, c.target);
        infoBox.classList.remove('visible');
      };
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const tmpVec = new THREE.Vector3();
    function animate() {
      requestAnimationFrame(animate);
      if (flyState) {
        flyState.t += 0.045;
        const k = 1 - Math.pow(1 - Math.min(1, flyState.t), 3);
        camera.position.lerpVectors(flyState.startPos, flyState.endPos, k);
        controls.target.lerpVectors(flyState.startTarget, flyState.endTarget, k);
        if (flyState.t >= 1) flyState = null;
      }
      controls.update();
      renderer.render(scene, camera);

      if (showPins) {
        const w = window.innerWidth, h = window.innerHeight;
        for (const lm of LANDMARKS) {
          const el = pinEls.get(lm.id);
          tmpVec.set(lm.pos[0], lm.pos[1], lm.pos[2]).project(camera);
          if (tmpVec.z > 1 || tmpVec.z < -1) {
            el.style.display = 'none';
          } else {
            const x = (tmpVec.x * 0.5 + 0.5) * w;
            const y = (-tmpVec.y * 0.5 + 0.5) * h;
            if (x < -80 || x > w + 80 || y < -40 || y > h + 80) {
              el.style.display = 'none';
            } else {
              el.style.display = 'flex';
              el.style.left = `${x.toFixed(1)}px`;
              el.style.top = `${y.toFixed(1)}px`;
            }
          }
        }
      }
    }
    animate();
  </script>
</body>
</html>
